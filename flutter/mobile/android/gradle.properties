android.useAndroidX=true
android.enableNdkApiLevelReplacement=true
android.defaultConfig.minSdk=21
android.kotlinc.jvmTarget=17
org.gradle.jvmargs=-Xlint:-options -Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Flutter 3.47's Gradle plugin reads AGP's old DSL, and several pub plugins still apply the Kotlin
# Gradle Plugin, so AGP 9's two new defaults have to stay off.
android.builtInKotlin=false
android.newDsl=false
# GRADLE_USER_HOME/gradle.properties wins over this file and enables all three of the settings below,
# which Flutter 3.47 does not support. System properties outrank both files, hence the systemProp
# duplicates: they apply to every entry point (flutter CLI, VS Code, Android Studio).
systemProp.org.gradle.project.android.builtInKotlin=false
systemProp.org.gradle.project.android.newDsl=false
systemProp.org.gradle.configuration-cache=false
