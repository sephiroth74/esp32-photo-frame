[package]
name = "photoframe_common"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
temp-file = "0.2.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
yup-oauth2 = "12.1.2"
