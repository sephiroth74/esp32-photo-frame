[package]
name = "photoframe_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = "4.5"
crossterm = "0.29.0"
log = "0.4"
ratatui = { "version" = "0.30", "features" = ["all-widgets"] }
tui-input = "0.15.0"
tui-logger = { features = [
    "tracing-subscriber",
    "tracing",
    "tracing-support",
], git = "https://github.com/gin66/tui-logger.git", branch = "master" }
serde = { version = "1.0.228", features = ["std", "derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "local-time",
    "env-filter",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
arboard = "3.4"
yup-oauth2 = "12.1.2"
strum = { version = "0.28.0", features = ["derive"] }
chrono = "0.4.44"
shlex = "1.3.0"
os_info = "3.14.0"
cron_manager = "0.1.1"
photoframe_common = { path = "../common_lib" }