[package]
name = "photoframe_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = "4.5"
crossterm = "0.28"
indicatif = "0.17"
log = "0.4"
ratatui = { "version" = "0.30", "features" = ["all-widgets"] }
dialoguer = "0.11"
tui_confirm_dialog = { version = "0.4.1", features = ["crossterm"] }
tui-input = "0.15.0"
tui-logger = { features = [
    "tracing-subscriber",
    "tracing",
    "tracing-support",
], git = "https://github.com/gin66/tui-logger.git", branch = "master" }
serde = { version = "1.0.228", features = ["std", "derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = [
    "local-time",
    "env-filter",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
pathdiff = "0.2"
arboard = "3.4"
yup-oauth2 = "11.0.0"
which = "8.0.0"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
chrono = "0.4.44"
shlex = "1.3.0"
