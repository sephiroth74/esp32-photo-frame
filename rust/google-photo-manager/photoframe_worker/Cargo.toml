[package]
name = "photoframe_worker"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
    "fmt",
    "ansi",
] }
tracing-appender = "0.2"
chrono = "0.4.44"
systemd-directories = "0.1.1"
dirs = "6.0.0"
os_info = "3.14.0"
