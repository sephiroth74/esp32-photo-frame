[package]
name = "insightface-rs"
version = "0.1.0"
edition = "2024"
description = "Rust binding for InsightFace - Face detection and recognition library"

[dependencies]
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
image = { version = "0.25.9", features = ["jpeg", "png", "webp", "tiff"] }
imageproc = "0.26.0"
ndarray = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
log = "0.4"
env_logger = "0.11"
kamadak-exif = "0.5"
ab_glyph = "0.2"

[lib]
name = "insightface_rs"
path = "src/lib.rs"
[[example]]
name = "detect_faces"
path = "examples/detect_faces.rs"
