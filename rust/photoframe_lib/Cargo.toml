[package]
name = "photoframe-lib"
version = "0.3.0"
edition = "2024"

[lib]
# Generate both a C-compatible dynamic library (for FFI) and a regular Rust library
crate-type = ["cdylib", "rlib"]

[dependencies]
image = "0.25"
anyhow = "1.0"
strum = "0.27.2"
strum_macros = "0.27.2"
serde = { version = "1.0.228", features = ["derive"] }
clap = { version = "4.5.54", features = ["derive"] }
crc32fast = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
