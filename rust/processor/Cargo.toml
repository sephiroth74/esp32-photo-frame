[package]
name = "processor"
version = "4.0.0"
edition = "2024"
authors = ["Alessandro Crugnola"]
description = "High-performance image processor for converting images to binary or bitmaps ready files to be displayed on ESP32 board with e-paper display."
license = "MIT"
repository = "https://github.com/sephiroth74/arduino/esp32-photo-frame"
keywords = ["esp32", "e-paper", "image-processing", "cli", "embedded"]
categories = ["multimedia::images", "command-line-utilities", "embedded"]
readme = "README.md"
default-run = "processor"

[[bin]]
name = "processor"
path = "src/main.rs"

[dependencies]
insightface-rs = { path = "../insightface_rs", optional = true }
photoframe-lib = { path = "../photoframe_lib" }

anyhow = "1.0.100"
clap = { version = "4.5.56", features = ["derive"] }
image = { version = "0.25.9", features = ["jpeg", "png", "webp", "tiff"] }
imageproc = "0.26.0"
exif = { package = "kamadak-exif", version = "0.6.1" }
regex = "1.12.2"
indicatif = "0.18.3"
rayon = "1.10.0"
walkdir = "2.5.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
tempfile = "3.14.0"
ab_glyph = "0.2.32"
num_cpus = "1.17.0"
sha2 = "0.10.9"
tabled = { version = "0.20.0", features = ["ansi"] }
chrono = "0.4.43"

[dev-dependencies]

[features]
default = ["ai"]
ai = ["insightface-rs"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
