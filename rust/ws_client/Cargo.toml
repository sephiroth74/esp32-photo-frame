[package]
name = "ws_client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.56", features = ["derive"] }
console = "0.16.2"
dialoguer = "0.11.0"
indicatif = "0.18.3"
tokio = { version = "1.49.0", features = [
    "time",
    "rt-multi-thread",
    "macros",
    "fs",
    "io-std",
] }
photoframe-lib = { path = "../photoframe_lib" }
tokio-tungstenite = "0.28.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3.31"
